<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upbrimi Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Your Dashboard</h1>
  </header>

  <main>
    <section class="progress">
      <h2>Coding Progress</h2>
      <p>Python Basics: <progress value="60" max="100"></progress> 60%</p>
      <p>C Programming: <progress value="40" max="100"></progress> 40%</p>
    </section>

    <section class="community">
      <h2>Community Updates</h2>
      <ul>
        <li>Alumni AMA scheduled for Friday</li>
        <li>Peer group project on Web Dev starting soon</li>
      </ul>
    </section>

    <section class="badges">
      <h2>Your Badges</h2>
      <p>Beginner Python 🏅 | Forum Contributor 🏅</p>
    </section>
  </main>
</body>
</html>
